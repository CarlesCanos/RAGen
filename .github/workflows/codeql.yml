name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  # CodeQL reads workflow-run metadata while processing and uploading results.
  # This permission is required when the repository is private.
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    # Code scanning is available on this account once the repository is public.
    # Keep private-repository pushes green; the same workflow activates after
    # the visibility change and can then be started with workflow_dispatch.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Analyze code
        uses: github/codeql-action/analyze@v4
